.htext .s{font-size:13px;color:var(--ink-2);line-height:1.4}
.chev{flex:none;color:var(--ink-2);transition:transform .2s;margin-top:3px}
.card.open .chev{transform:rotate(180deg)}
.body{display:none;padding:0 15px 15px;animation:fade .2s ease}
.card.open .body{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}

.cmp{display:flex;flex-direction:column;gap:8px}
.cmp .row{border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.45}
.cmp .old{background:#f1ece2;border:1px solid var(--line)}
.cmp .new{background:var(--red-soft);border:1px solid #e7c9ce}

]},
];

const main=document.getElementById('main');
const qEl=document.getElementById('q');
const clearEl=document.getElementById('clear');
let query='';

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function hl(text,q){
  if(!q) return text;
  const nq=norm(q), nt=norm(text);
  const i=nt.indexOf(nq);
  if(i<0) return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}

function render(){
  const nq=norm(query.trim());
  let html='<div class="meta">'+META.map((m,i)=>'<span class="chip'+(i?' gray':'')+'">'+m+'</span>').join('')+'</div>';
  html+='<div class="legend"><span><i class="dot moi"></i>MỚI — điểm bổ sung trong HD05</span><span><i class="dot khac"></i>KHÁC — thay đổi so với HD36</span></div>';
  let shown=0;
  GROUPS.forEach(g=>{
    const matched=g.items.filter(it=>{
      if(!nq) return true;
      return norm(it.t+' '+it.s+' '+it.old+' '+it.new+' '+(it.note||'')+' '+(it.k||'')).includes(nq);
    });
    if(!matched.length) return;
    html+='<div class="grouphead">'+g.name+'</div>';
    matched.forEach(it=>{
      shown++;
      const open=nq?' open':'';
      const cls=it.tag==='MỚI'?'moi':'khac';
      html+='<div class="card'+open+'">'
        +'<button class="head" type="button">'
        +'<span class="badge '+cls+'">'+it.tag+'</span>'
        +'<span class="htext"><span class="t">'+hl(it.t,query.trim())+'</span>'
        +'<span class="s">'+hl(it.s,query.trim())+'</span></span>'
        +'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>'
        +'</button>'
        +'<div class="body"><div class="cmp">'
        +'<div class="row old"><span class="lbl">HD 36 — 2018 (cũ)</span>'+it.old+'</div>'
        +'<div class="row new"><span class="lbl">HD 05 — 2026 (mới)</span>'+it.new+'</div>'
        +'</div>'
        +(it.note?'<div class="note"><b>Lưu ý:</b> '+it.note+'</div>':'')
        +'</div></div>';
    });
  });
  if(!shown) html+='<div class="empty"><b>Không tìm thấy</b>Thử từ khoá khác, ví dụ: <i>chữ ký số, đặc khu, line spacing, QĐ</i>.</div>';
  main.innerHTML=html;
  main.querySelectorAll('.card').forEach(c=>{
    c.querySelector('.head').addEventListener('click',()=>c.classList.toggle('open'));
  });
}
qEl.addEventListener('input',()=>{query=qEl.value;clearEl.classList.toggle('show',!!query);render();});
clearEl.addEventListener('click',()=>{query='';qEl.value='';clearEl.classList.remove('show');qEl.focus();render();});
render();
</script>

<div class="wrap"><div class="footer">
  Đối chiếu Hướng dẫn 36-HD/VPTW (03/4/2018) và Hướng dẫn 05-HD/VPTW (27/5/2026).<br>
  Bản tóm tắt điểm khác — khi soạn thảo chính thức cần đối chiếu nguyên văn cả hai hướng dẫn.
</div></div>
